<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shortcut Remote — Live HUD</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #16181d;
    --border: #2a2d35;
    --text: #d6d8de;
    --dim: #6c7080;
    --accent: #4dd0e1;
    --press: #66ff99;
    --release: #555;
    --wheel-cw: #ffd86b;
    --wheel-ccw: #b388ff;
    --error: #ff6b6b;
    --keypad-shell: #2c2e38;
    --keypad-shell-edge: #1d1f27;
    --key-bg: #1b1d24;
    --key-border: #353842;
    --key-text: #e6e8ee;
    --layer-active: #4dd0e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }
  h1 { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 16px; }
  .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; }
  .stats { font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim); }
  #status { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  #status.connected { background: rgba(102, 255, 153, 0.12); color: var(--press); }
  #status.connected .dot { background: var(--press); animation: pulse 2s infinite; }
  #status.disconnected { background: rgba(255, 107, 107, 0.12); color: var(--error); }
  #status.disconnected .dot { background: var(--error); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .panel h2 {
    margin: 0 0 10px 0;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--dim);
  }

  /* ---------- Keypad rendering (mirrors the XP-Pen UI graphic) ---------- */
  .keypad {
    width: 360px; max-width: 100%;
    margin: 0 auto;
    background: linear-gradient(180deg, var(--keypad-shell) 0%, var(--keypad-shell-edge) 100%);
    border-radius: 18px;
    padding: 24px 24px 28px 24px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 6px 24px rgba(0,0,0,0.4);
    position: relative;
  }
  .keypad-label { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; position: absolute; right: 16px; top: 12px; opacity: 0.5; }

  .wheel-area { display: flex; justify-content: center; margin-bottom: 22px; }
  .wheel {
    width: 132px; height: 132px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #232631 30%, #15171c 60%, #0d0e12 100%);
    border: 2px solid #1a1c23;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .wheel-ring {
    position: absolute; inset: 12px;
    border-radius: 50%;
    border: 2px solid var(--key-border);
    transition: border-color 0.15s, transform 0.08s;
  }
  .wheel.active-cw .wheel-ring { border-color: var(--wheel-cw); transform: rotate(8deg); }
  .wheel.active-ccw .wheel-ring { border-color: var(--wheel-ccw); transform: rotate(-8deg); }
  .wheel-center {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--key-bg);
    border: 1px solid var(--key-border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--key-text);
    font-size: 11px; font-weight: 600;
    transition: background 0.05s, border-color 0.05s, transform 0.08s;
  }
  .wheel-center.held { background: rgba(102,255,153,0.18); border-color: var(--press); transform: scale(1.08); }

  .key-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr 1fr;
    gap: 8px;
  }
  .key {
    background: var(--key-bg);
    border: 1px solid var(--key-border);
    border-radius: 8px;
    padding: 8px 6px;
    color: var(--key-text);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
    min-height: 56px;
    transition: background 0.05s, border-color 0.05s, transform 0.08s;
    user-select: none;
    overflow: hidden;
  }
  .key .kname { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
  .key .klabel { font-size: 10px; color: var(--dim); margin-top: 2px; line-height: 1.15; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .key .kshortcut { font-size: 9px; color: var(--accent); margin-top: 2px; font-family: ui-monospace, monospace; }
  .key.held { background: rgba(102,255,153,0.18); border-color: var(--press); transform: scale(1.05); }
  .key.fading { background: rgba(102,255,153,0.06); border-color: rgba(102,255,153,0.25); }
  .key.unmapped { opacity: 0.6; }
  .key.unmapped .kname::after { content: " ·"; color: var(--dim); }

  /* Specific layout per the XP-Pen graphic with rotation 90°. */
  .key.k8  { grid-column: 1; grid-row: 1; }
  .key.k4  { grid-column: 2; grid-row: 1; }
  .key.k1  { grid-column: 3; grid-row: 1; }
  .key.k9  { grid-column: 1; grid-row: 2 / span 2; }
  .key.k5  { grid-column: 2; grid-row: 2; }
  .key.k2  { grid-column: 3; grid-row: 2; }
  .key.k6  { grid-column: 2; grid-row: 3; }
  .key.k3  { grid-column: 3; grid-row: 3; }
  .key.k10 { grid-column: 1; grid-row: 4; }
  .key.k7  { grid-column: 2 / span 2; grid-row: 4; }

  /* ---------- Layer toggle ---------- */
  .layer-row { display: flex; gap: 8px; margin: 14px auto 0 auto; justify-content: center; }
  .layer-btn {
    background: var(--key-bg);
    border: 1px solid var(--key-border);
    color: var(--key-text);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
    cursor: pointer;
    transition: all 0.1s;
  }
  .layer-btn.active { border-color: var(--layer-active); color: var(--layer-active); background: rgba(77,208,225,0.10); }
  .layer-btn.disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---------- Wheel + battery panels ---------- */
  .wheel-counters { display: flex; gap: 16px; align-items: center; }
  .wheel-counter {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #1c1f26;
    min-width: 90px;
  }
  .wheel-counter .dir { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
  .wheel-counter .count { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .wheel-counter.flash-cw { border-color: var(--wheel-cw); color: var(--wheel-cw); }
  .wheel-counter.flash-ccw { border-color: var(--wheel-ccw); color: var(--wheel-ccw); }

  .battery { display: flex; align-items: center; gap: 12px; }
  .battery .bar { width: 120px; height: 14px; background: #1c1f26; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .battery .fill { height: 100%; background: #66cc88; transition: width 0.3s ease; }
  .battery.low .fill { background: #ff9966; }
  .meta { color: var(--dim); font-size: 12px; }

  /* ---------- Event log ---------- */
  #log { max-height: 360px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace; font-size: 12px; }
  #log .entry {
    padding: 4px 8px;
    border-left: 3px solid transparent;
    border-radius: 3px;
    display: grid;
    grid-template-columns: 90px 100px 1fr 200px;
    gap: 12px;
    animation: slidein 0.12s ease-out;
  }
  @keyframes slidein { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
  #log .entry.button_press { border-left-color: var(--press); }
  #log .entry.button_release { border-left-color: var(--release); color: var(--dim); }
  #log .entry.wheel { border-left-color: var(--wheel-cw); }
  #log .entry.wheel.ccw { border-left-color: var(--wheel-ccw); }
  #log .entry.battery { border-left-color: var(--accent); color: var(--dim); }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>Shortcut Remote — Live HUD</h1>
    <div class="sub">Hanvon Ugee USB 0x28bd:0x0202 · vendor page 0xFF0A · MCP-AQL JIT adapter</div>
  </div>
  <div>
    <div id="status" class="disconnected"><span class="dot"></span><span class="label">connecting…</span></div>
    <div class="stats" id="stats" style="margin-top:6px"></div>
  </div>
</div>

<div class="layout">
  <div>
    <div class="panel">
      <h2>Keypad (Layer <span id="active-layer">I</span>)</h2>
      <div class="keypad">
        <div class="keypad-label">XP·pen</div>
        <div class="wheel-area">
          <div class="wheel" id="wheel">
            <div class="wheel-ring"></div>
            <div class="wheel-center" id="k11" data-k="K11">
              <div class="kname">K11</div>
              <div class="klabel">wheel·click</div>
            </div>
          </div>
        </div>
        <div class="key-grid">
          <div class="key k8"  data-k="K8"><div class="kname">K8</div><div class="klabel"></div><div class="kshortcut"></div></div>
          <div class="key k4"  data-k="K4"><div class="kname">K4</div><div class="klabel"></div><div class="kshortcut"></div></div>
          <div class="key k1"  data-k="K1"><div class="kname">K1</div><div class="klabel"></div><div class="kshortcut"></div></div>
          <div class="key k9"  data-k="K9"><div class="kname">K9</div><div class="klabel"></div><div class="kshortcut"></div></div>
          <div class="key k5"  data-k="K5"><div class="kname">K5</div><div class="klabel"></div><div class="kshortcut"></div></div>
          <div class="key k2"  data-k="K2"><div class="kname">K2</div><div class="klabel"></div><div class="kshortcut"></div></div>
          <div class="key k6"  data-k="K6"><div class="kname">K6</div><div class="klabel"></div><div class="kshortcut"></div></div>
          <div class="key k3"  data-k="K3"><div class="kname">K3</div><div class="klabel"></div><div class="kshortcut"></div></div>
          <div class="key k10" data-k="K10"><div class="kname">K10</div><div class="klabel"></div><div class="kshortcut"></div></div>
          <div class="key k7"  data-k="K7"><div class="kname">K7</div><div class="klabel"></div><div class="kshortcut"></div></div>
        </div>
        <div class="layer-row" id="layer-row">
          <button class="layer-btn" data-layer="I">I</button>
          <button class="layer-btn" data-layer="II">II</button>
          <button class="layer-btn" data-layer="III">III</button>
          <button class="layer-btn" data-layer="IV">IV</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Wheel</h2>
      <div class="wheel-counters">
        <div class="wheel-counter" id="wheel-cw"><div class="dir">CW</div><div class="count">0</div></div>
        <div class="wheel-counter" id="wheel-ccw"><div class="dir">CCW</div><div class="count">0</div></div>
        <div class="meta" id="wheel-net"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Battery</h2>
      <div class="battery" id="battery">
        <div class="bar"><div class="fill" style="width:0%"></div></div>
        <div class="meta"><span id="battery-pct">—</span> · <span id="battery-charge">—</span></div>
      </div>
    </div>
  </div>

  <div>
    <div class="panel">
      <h2>Event log (last 50)</h2>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
(() => {
  // ============================================================
  // K# → bit mapping. Set as we label each button.
  // kind = "primary" | "secondary"; bit = 0..7 for primary, 0..2 for secondary.
  // null bits mean "not yet labeled" — those K# render as unmapped (dim).
  // ============================================================
  // Initial best-guess linear mapping. Almost certainly wrong in detail.
  // Press any button — the light that comes on tells you the current guess for that physical key.
  // Tell me the mismatches and I'll fix them.
  const K_TO_BIT = {
    K1:  { kind: "primary",   bit: 0 },
    K2:  { kind: "primary",   bit: 1 },
    K3:  { kind: "primary",   bit: 2 },
    K4:  { kind: "primary",   bit: 3 },
    K5:  { kind: "primary",   bit: 4 },
    K6:  { kind: "primary",   bit: 5 },
    K7:  { kind: "primary",   bit: 6 },
    K8:  { kind: "primary",   bit: 7 },
    K9:  { kind: "secondary", bit: 0 },
    K10: { kind: "secondary", bit: 1 },
    K11: { kind: "secondary", bit: 2 }, // wheel-center button
  };
  // Build inverse lookup: "primary:N" or "secondary:N" → "K#"
  function bitKey(kind, bit) { return kind + ":" + bit; }
  const BIT_TO_K = {};
  for (const [k, m] of Object.entries(K_TO_BIT)) {
    if (m.kind != null && m.bit != null) BIT_TO_K[bitKey(m.kind, m.bit)] = k;
  }
  function lookupK(kind, bit) { return BIT_TO_K[bitKey(kind, bit)] || null; }

  const $ = (id) => document.getElementById(id);

  // Mark unmapped keys.
  document.querySelectorAll(".key, .wheel-center").forEach((el) => {
    const k = el.dataset.k;
    if (!K_TO_BIT[k] || K_TO_BIT[k].bit == null) el.classList.add("unmapped");
  });

  // ============================================================
  // XP-Pen mapping rendering — fetch from /xppen-mappings.json and update labels.
  // ============================================================
  let activeLayer = "I";
  let mappings = null;

  async function loadMappings() {
    try {
      const r = await fetch("/xppen-mappings.json");
      mappings = await r.json();
      renderLayer(activeLayer);
      renderLayerButtons();
    } catch (err) {
      console.error("failed to load /xppen-mappings.json", err);
    }
  }

  function renderLayer(layer) {
    activeLayer = layer;
    $("active-layer").textContent = layer;
    document.querySelectorAll(".layer-btn").forEach((b) => b.classList.toggle("active", b.dataset.layer === layer));
    if (!mappings) return;
    const layerData = mappings.layers[layer];
    if (!layerData) return;
    for (let i = 1; i <= 11; i++) {
      const el = document.querySelector(`[data-k="K${i}"]`);
      if (!el) continue;
      const m = layerData.keys["K" + i];
      const labelEl = el.querySelector(".klabel");
      const shortcutEl = el.querySelector(".kshortcut");
      if (!m) continue;
      if (m.customized && m.label) {
        labelEl.textContent = m.label;
        shortcutEl.textContent = m.human_shortcut || "";
      } else {
        labelEl.textContent = `(default Actid ${m.actid})`;
        shortcutEl.textContent = "";
      }
    }
  }

  function renderLayerButtons() {
    if (!mappings) return;
    document.querySelectorAll(".layer-btn").forEach((b) => {
      const layer = mappings.layers[b.dataset.layer];
      b.classList.toggle("disabled", !layer || !layer.enabled);
    });
  }
  document.querySelectorAll(".layer-btn").forEach((b) => {
    b.addEventListener("click", () => renderLayer(b.dataset.layer));
  });

  // ============================================================
  // Live event handling
  // ============================================================
  let cwCount = 0, ccwCount = 0, eventCount = 0;
  const fadeTimers = new WeakMap();

  function setHeld(el, held) {
    if (!el) return;
    if (held) {
      el.classList.add("held"); el.classList.remove("fading");
      const t = fadeTimers.get(el);
      if (t) clearTimeout(t);
    } else {
      el.classList.remove("held"); el.classList.add("fading");
      const t = setTimeout(() => el.classList.remove("fading"), 600);
      fadeTimers.set(el, t);
    }
  }

  function elForKind(kind, bit) {
    const k = lookupK(kind, bit);
    if (k) return document.querySelector(`[data-k="${k}"]`);
    return null;
  }

  function pulseWheel(dir) {
    const wheelEl = $("wheel");
    wheelEl.classList.remove("active-cw", "active-ccw");
    void wheelEl.offsetWidth;
    wheelEl.classList.add("active-" + dir);
    setTimeout(() => wheelEl.classList.remove("active-" + dir), 180);
    const counterEl = $("wheel-" + dir);
    counterEl.classList.add("flash-" + dir);
    setTimeout(() => counterEl.classList.remove("flash-" + dir), 150);
  }

  function appendLog(ev) {
    const log = $("log");
    const entry = document.createElement("div");
    entry.className = "entry " + (ev.kind || "");
    if (ev.kind === "wheel" && ev.wheel_direction === "ccw") entry.classList.add("ccw");
    const ts = new Date(ev.ts).toLocaleTimeString("en-US", { hour12: false }) + "." + String(ev.ts % 1000).padStart(3, "0");
    let summary;
    if (ev.kind === "button_press") {
      const parts = [];
      for (const b of ev.new_primary_bits || []) {
        const k = lookupK("primary", b);
        parts.push(k ? `${k} (P${b})` : `P${b}`);
      }
      for (const b of ev.new_secondary_bits || []) {
        const k = lookupK("secondary", b);
        parts.push(k ? `${k} (S${b})` : `S${b}`);
      }
      summary = parts.join(" + ") || "?";
    } else if (ev.kind === "button_release") {
      summary = "release";
    } else if (ev.kind === "wheel") {
      summary = "wheel " + (ev.wheel_direction || "?");
    } else if (ev.kind === "battery") {
      summary = `${ev.battery_percent}% ${ev.charging ? "(charging)" : ""}`;
    } else summary = ev.kind || "event";
    entry.innerHTML = `<span>${ts}</span><span>${ev.kind}</span><span>${summary}</span><span style="color:var(--dim)">${ev.raw_hex || ""}</span>`;
    log.prepend(entry);
    while (log.childElementCount > 50) log.lastElementChild.remove();
  }

  function updateStats() {
    $("stats").textContent = `events: ${eventCount} · cw: ${cwCount} · ccw: ${ccwCount} · net: ${cwCount - ccwCount}`;
    $("wheel-cw").querySelector(".count").textContent = cwCount;
    $("wheel-ccw").querySelector(".count").textContent = ccwCount;
    $("wheel-net").textContent = "net = " + (cwCount - ccwCount);
  }

  function applyEvent(ev) {
    eventCount++;
    if (ev.kind === "button_press") {
      for (const b of ev.held_primary_bits || []) setHeld(elForKind("primary", b), true);
      for (const b of ev.held_secondary_bits || []) setHeld(elForKind("secondary", b), true);
    } else if (ev.kind === "button_release") {
      for (const b of ev.released_primary_bits || []) setHeld(elForKind("primary", b), false);
      for (const b of ev.released_secondary_bits || []) setHeld(elForKind("secondary", b), false);
    } else if (ev.kind === "wheel") {
      if (ev.wheel_direction === "cw") cwCount++;
      else if (ev.wheel_direction === "ccw") ccwCount++;
      pulseWheel(ev.wheel_direction);
    } else if (ev.kind === "battery") {
      const pct = ev.battery_percent ?? 0;
      const fill = $("battery").querySelector(".fill");
      fill.style.width = pct + "%";
      $("battery-pct").textContent = pct + "%";
      $("battery-charge").textContent = ev.charging ? "charging" : "not charging";
      $("battery").classList.toggle("low", pct < 20);
    }
    appendLog(ev);
    updateStats();
  }

  let ws;
  function connect() {
    ws = new WebSocket("ws://" + location.host + "/events");
    ws.onopen = () => {
      const s = $("status");
      s.className = "connected"; s.querySelector(".label").textContent = "connected";
    };
    ws.onclose = () => {
      const s = $("status");
      s.className = "disconnected"; s.querySelector(".label").textContent = "disconnected — reconnecting…";
      setTimeout(connect, 1000);
    };
    ws.onerror = () => {};
    ws.onmessage = (m) => { try { applyEvent(JSON.parse(m.data)); } catch (err) { console.error(err); } };
  }
  connect();
  updateStats();
  loadMappings();
})();
</script>
</body>
</html>
